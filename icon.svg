<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B21B6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shine)"/>

  <!-- Monograma A: inicial de Aleze, con una puerta integrada en la base -->
  <!-- que la lee tanto como letra "A" como una tienda de barrio de un vistazo -->
  <g>
    <path d="M256,90
             L390,368
             L328,368
             L305,318
             L207,318
             L184,368
             L122,368
             Z
             M256,168
             L216,258
             L296,258
             Z"
          fill="white" fill-rule="evenodd"/>
    <rect x="232" y="318" width="48" height="50" rx="6" fill="url(#bg)"/>
  </g>

  <!-- Acento verde: mismo verde "Disponible" del resto de la app -->
  <circle cx="382" cy="150" r="16" fill="#10B981"/>
</svg>
